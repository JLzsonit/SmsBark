name: UI Screenshots

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - 'Resources/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

jobs:
  shots:
    name: 模拟器截图
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: 生成工程
        run: xcodegen generate --spec project.yml

      - name: 编译（模拟器）
        run: |
          set -euo pipefail
          xcodebuild \
            -project SmsBark.xcodeproj \
            -scheme SmsBark \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 启动模拟器并截图
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/SmsBark.app"
          ls -d "$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for runtime, devs in sorted(d.items(), reverse=True):
              if 'iOS' not in runtime: continue
              for x in devs:
                  if x.get('isAvailable') and 'iPhone' in x['name']:
                      print(x['udid']); sys.exit(0)
          sys.exit(1)")
          echo "模拟器: $UDID"
          echo "$UDID" > udid.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots logs
          for i in 0 1 2 3; do
            xcrun simctl terminate "$UDID" cn.zsonit.smsbark 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" cn.zsonit.smsbark -tab "$i" > "logs/launch_$i.txt" 2>&1 || echo "launch 失败($i)" | tee -a "logs/launch_$i.txt"
            sleep 30
            xcrun simctl io "$UDID" screenshot "shots/tab$i.png"
          done
          xcrun simctl spawn "$UDID" log show --last 6m --style compact --predicate 'processImagePath CONTAINS "SmsBark"' > logs/applog.txt 2>&1 || true
          ls -lh shots
          cp -R ~/Library/Logs/DiagnosticReports/SmsBark* logs/ 2>/dev/null || echo "无崩溃报告"

      - name: 截图入库（docs/screenshots）
        if: success()
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          cp shots/tab*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "截图无变化，跳过提交"
            exit 0
          fi
          git commit -m "ci: 更新界面截图 [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            shots/*.png
            logs/*
          if-no-files-found: error
          retention-days: 15
