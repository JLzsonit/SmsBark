name: Build IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# 只构建最新提交，排队中的旧构建自动取消
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并打包 IPA (${{ matrix.os }} · ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # 用 iOS 27 SDK 编译：SwiftUI TabView 自动采用系统液态玻璃标签栏（发布用这条腿）
          - os: xcode-27
            sdk: iOS 27
            publish: true
          # 备份腿：iOS 26 SDK，同样是液态玻璃外观，主腿失败时至少还有产物
          - os: macos-26
            sdk: iOS 26
            publish: false

    steps:
      - name: 跳过过期提交
        run: |
          HEAD=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.ref_name }}" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          if [ "$GITHUB_SHA" != "$HEAD" ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "== 此提交已不是 main 最新，跳过构建，为新提交让机器（秒退）"
          else
            echo "== 最新提交，正常构建"
          fi

      - name: 环境信息
        if: env.SKIP != '1'
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          xcode-select -p || true

      - name: 检出代码
        if: env.SKIP != '1'
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        if: env.SKIP != '1'
        run: xcodegen generate --spec project.yml

      - name: 编译（不签名）
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project SmsBark.xcodeproj \
            -scheme SmsBark \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SmsBark.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包成 IPA
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SmsBark.xcarchive/Products/Applications/SmsBark.app"
          if [ ! -d "$APP" ]; then
            echo "没找到 app，打印 archive 结构："
            find "$RUNNER_TEMP/SmsBark.xcarchive" -maxdepth 5 | head -50
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          rm -f SmsBark-unsigned.ipa
          zip -qry SmsBark-unsigned.ipa Payload
          ls -lh SmsBark-unsigned.ipa
          shasum -a 256 SmsBark-unsigned.ipa | tee SmsBark-unsigned.ipa.sha256
          lipo -info "$APP/SmsBark" || true

      - name: 上传构建产物
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: SmsBark-ipa-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/SmsBark-unsigned.ipa
            ${{ runner.temp }}/SmsBark-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 准备 Release 说明
        if: env.SKIP != '1' && startsWith(github.ref, 'refs/tags/') && matrix.publish
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          F="docs/release-notes/$TAG.md"
          if [ -f "$F" ]; then
            cp "$F" "$RUNNER_TEMP/release-notes.md"
          else
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo main)
            {
              echo "### $TAG"
              echo
              echo "**完整变更**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            } > "$RUNNER_TEMP/release-notes.md"
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: 打 tag 时发布到 Release
        if: env.SKIP != '1' && startsWith(github.ref, 'refs/tags/') && matrix.publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/SmsBark-unsigned.ipa
            ${{ runner.temp }}/SmsBark-unsigned.ipa.sha256
          body_path: ${{ runner.temp }}/release-notes.md
